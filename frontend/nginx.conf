server {
    listen 80;

    # Serve the React app for all non-API routes
    location / {
        root /usr/share/nginx/html;
        # This ensures React Router works correctly — all routes serve index.html
        try_files $uri /index.html;
    }

    # Proxy all /api requests to the FastAPI backend container
    # Uses the Docker service name 'governed-ai-api' for internal networking
    location /api {
        proxy_pass http://governed-ai-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}